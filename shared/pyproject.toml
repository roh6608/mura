[project]
name = "mura-shared"
version = "0.1.0"
description = "Shared utilities for the Mura applications"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The package root is this directory itself, so the import path is
# `shared.core...` while the code stays flat at shared/core/.
[tool.setuptools]
packages = ["shared", "shared.core"]

[tool.setuptools.package-dir]
shared = "."
