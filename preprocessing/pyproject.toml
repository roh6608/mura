[project]
name = "preprocessing"
version = "0.1.0"
description = "Pre-processing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "opencv-python-headless==5.0.0.93",
    "h5py==3.16.0",
    "mura-shared",
    "loguru>=0.7.3",
    "matplotlib>=3.9",
]


[project.optional-dependencies]

gpu = [
    "cupy-cuda12x>=14",
    "nvidia-cublas-cu12",
    "nvidia-cusolver-cu12",  
    "nvidia-cusparse-cu12",  
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-nvrtc-cu12", 
    "nvidia-nvjitlink-cu12",
    "nvidia-cuda-runtime-cu12",
]

[project.scripts]
preprocess = "preprocess.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pyright>=1.1.411",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocess"]

[tool.uv.sources]
mura-shared = { path = "../shared", editable = true }

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
extend-select = [
    "ANN",
    "BLE001",
    "B",
    "A",
    "C4",
    "FA",
    "ICN",
    "PIE",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TC",
    "ARG",
    "PTH",
    "C90",
    "NPY",
    "PD",
    "N",
    "PERF",
    "E",
    "W",
    "D",
    "F",
    "I",
    "PL",
    "TID",
    "UP",
    "FURB",
    "RUF",
]

ignore = ["RUF100"]
logger-objects = ["loguru.logger"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Do not defer annotations globally; quote forward references where required."
"logging".msg = "Use loguru.logger for logging."

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["TID252"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["**/.venv", "**/__pycache__", "**/out"]
