[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fea"]

[project]
name = "sim-fea"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gmsh>=4.15.2",
    "loguru>=0.7.3",
    "mura-shared",
    "numpy>=2.5.1",
    "pathlib>=1.0.1",
    "pyamg>=5.3.0",
    "scipy>=1.18.0",
    "vtk>=9.6.2",
]

[project.scripts]
sim-fea = "fea.main:main"

[tool.uv.sources]
mura-shared = { path = "../shared", editable = true }

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["BLE"]
